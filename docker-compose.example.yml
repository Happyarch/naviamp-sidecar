# Example Docker Compose setup for Navidrome + naviamp-sidecar + Caddy.
#
# Architecture
# ────────────
#   Client (Naviamp app)
#       │
#       ▼  port 80 (or 443 with a domain — see Caddyfile)
#   [caddy]  ── /naviamp/* ──▶  [naviamp-sidecar]  ── read-only ──▶  navidrome.db
#       │
#       └── everything else ──▶  [navidrome]
#
# Caddy is the only container that exposes ports to the outside world.
# Navidrome and the sidecar are on the internal Docker network only —
# clients cannot reach them directly.
#
# Usage
# ─────
# 1. Copy this file to docker-compose.yml in your Navidrome directory.
# 2. Copy Caddyfile to the same directory.
# 3. Adjust the volume paths (./data, ./music) to match your setup.
# 4. If you have a domain, edit Caddyfile to use the HTTPS block.
# 5. docker compose up -d
#
# Point the Naviamp app at http://<your-server-ip> (or https://music.example.com).
# The app will probe /naviamp/capabilities automatically and enable sidecar features.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy stores TLS certificates here — persist so they survive restarts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - navidrome
      - naviamp-sidecar
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    # No ports: exposed — Navidrome is only reachable via Caddy on the internal network.
    volumes:
      - ./data:/data
      - ./music:/music:ro
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
    restart: unless-stopped

  naviamp-sidecar:
    image: ghcr.io/happyarch/naviamp-sidecar:latest
    # No ports: exposed — the sidecar is only reachable via Caddy on the internal network.
    environment:
      # Navidrome is reachable by its service name on the Docker network.
      NAVIAMP_NAVIDROME_URL: "http://navidrome:4533"
      NAVIAMP_DB_TYPE: "sqlite"
      NAVIAMP_DB_PATH: "/data/navidrome.db"
    volumes:
      # Read-only mount — the sidecar reads navidrome.db but never writes to it.
      - ./data:/data:ro
    depends_on:
      - navidrome
    restart: unless-stopped

volumes:
  caddy_data:   # TLS certificates — persisted across container restarts
  caddy_config: # Caddy runtime config
